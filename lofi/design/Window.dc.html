<script type="text/x-dc" data-dc-script data-props='{"weather":{"editor":"enum","default":"sonnig","options":["sonnig","bewoelkt","regen","schnee","gewitter","nacht"]},"blinds":{"editor":"range","default":40,"min":0,"max":100,"step":10,"unit":"%"},"$preview":{"width":1260,"height":672}}'>
class Component extends DCLogic {
  renderVals() {
    const W = {
      sonnig:   { sky: '#FFF4D8', halo: '#553530', halo2: '#633E33', light: 0.2, sill: '#E0A060' },
      bewoelkt: { sky: '#CFC9BE', halo: '#4F322D', halo2: '#563832', light: 0.08, sill: '#A8785A' },
      regen:    { sky: '#7E8A92', halo: '#4C302C', halo2: '#4F332F', light: 0.04, sill: '#8A5A42' },
      schnee:   { sky: '#D6DCE0', halo: '#533833', halo2: '#5C413B', light: 0.1, sill: '#B8927A' },
      gewitter: { sky: '#4A5062', halo: '#4A2E2B', halo2: '#4A2E2B', light: 0.02, sill: '#8A4E30' },
      nacht:    { sky: '#1C2236', halo: '#4A2E2B', halo2: '#4A2E2B', light: 0, sill: '#8A4E30' }
    };
    const weather = W[this.props.weather] ? this.props.weather : 'sonnig';
    const w = W[weather];
    const b = Math.max(0, Math.min(100, this.props.blinds ?? 40));
    const blindH = Math.round((88 * b / 100) / 3) * 3;
    const cordH = Math.min(84, 40 + Math.round((88 - blindH) / 2));
    return {
      weather: weather,
      sky: w.sky, halo: w.halo, halo2: w.halo2, sillLight: w.sill,
      light: String(b >= 100 ? w.light * 0.3 : w.light),
      stripes: b > 0, solid: b === 0,
      blindH: blindH, railY: 9 + blindH, cordH: cordH, cordY: 9 + cordH,
      isSonnig: weather === 'sonnig', isBewoelkt: weather === 'bewoelkt', isRegen: weather === 'regen',
      isSchnee: weather === 'schnee', isGewitter: weather === 'gewitter', isNacht: weather === 'nacht'
    };
  }
}
</script>
