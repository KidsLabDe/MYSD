<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Easter Egg – Bildschirme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1272px; height: 1140px; box-sizing: border-box; padding: 40px; background: #2A1A18; font-family: 'Pixelify Sans', monospace; color: #EDE0C8; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 32px; font-weight: 700">Easter Egg „Bug-Jagd“ · die vier Bildschirme (50 %)</div>
<div style="font-size: 18px; color: #C8B89A">Originalgröße 1152×792 px im vergrößerten Monitor. Eigenes Spiel im Labyrinth-Genre: Glühbirne sammelt Bits, vier Bugs jagen sie, Kaffee macht die Bugs fangbar. Ranglisten-Namen sind Beispiele.</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="width: 576px; height: 396px; position: relative; overflow: hidden; border: 3px solid #5E3320; box-sizing: content-box">
<div style="position: absolute; left: 0px; top: 0px; width: 1152px; height: 792px; transform: scale(0.5); transform-origin: 0px 0px"><dc-import name="Arcade" screen="{{s.id}}" hint-size="1152px,792px"></dc-import></div>
</div>
<div style="font-size: 20px; font-weight: 700">{{s.label}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1272,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    return { screens: [
      { id: 'title', label: '1 · Titel · ENTER startet' },
      { id: 'play', label: '2 · Spiel · Pfeiltasten' },
      { id: 'name', label: '3 · Game Over · Namen eintragen (bis 8 Zeichen)' },
      { id: 'board', label: '4 · Rangliste · Top 10, neuer Eintrag markiert' }
    ] };
  }
}
</script>
</body>
</html>
